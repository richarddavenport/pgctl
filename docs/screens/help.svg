<text x="248" y="495.93" textLength="171.6" lengthAdjust="spacing" fill="#d0d0d0" xml:space="preserve">   esc          cancel</text>
<text x="809.6" y="495.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="240.2" y="512.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="809.6" y="512.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
