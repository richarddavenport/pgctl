<text x="279.2" y="73.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="73.42" textLength="46.8" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">Moving</text>
