<text x="240.2" y="252.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="809.6" y="252.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="240.2" y="268.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="248" y="268.43" textLength="46.8" lengthAdjust="spacing" fill="#d0d0d0" xml:space="preserve"> DOING</text>
