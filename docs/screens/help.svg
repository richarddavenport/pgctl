<text x="240.2" y="284.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="248" y="284.68" textLength="514.8" lengthAdjust="spacing" fill="#d0d0d0" xml:space="preserve">   n            take a snapshot — choose environment and databases</text>
