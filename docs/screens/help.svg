<text x="372.8" y="187.18" textLength="187.2" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">filter the focused panel</text>
<text x="770.6" y="187.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
