<svg xmlns="http://www.w3.org/2000/svg" width="792.4" height="625.25" viewBox="0 0 792.4 625.25" font-family="ui-monospace, &#39;SF Mono&#39;, SFMono-Regular, Menlo, Consolas, &#39;DejaVu Sans Mono&#39;, monospace" font-size="13" role="img">
<title>terminal frame, 98 columns by 37 rows</title>
<rect width="792.4" height="625.25" rx="7" fill="#0c0c0e"/>
<text x="279.2" y="24.68" textLength="499.2" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">╭──────────────────────────────────────────────────────────────╮</text>
<text x="279.2" y="40.92" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="40.92" textLength="78" lengthAdjust="spacing" fill="#ff00ff" font-weight="600" xml:space="preserve">pgctl keys</text>
<text x="770.6" y="40.92" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="57.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="770.6" y="57.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="73.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="73.42" textLength="78" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">↑ 22 above</text>
<text x="770.6" y="73.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="89.67" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="89.67" textLength="39" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">space</text>
<text x="372.8" y="89.67" textLength="46.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">toggle</text>
<text x="770.6" y="89.67" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="105.92" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="105.92" textLength="39" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">enter</text>
<text x="372.8" y="105.92" textLength="140.4" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">run it, or plan it</text>
<text x="770.6" y="105.92" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="122.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="122.17" textLength="23.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">esc</text>
<text x="372.8" y="122.17" textLength="46.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">cancel</text>
<text x="770.6" y="122.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="138.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="770.6" y="138.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="154.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="154.68" textLength="109.2" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">Reading a plan</text>
<text x="770.6" y="154.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="170.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="170.93" textLength="23.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">↑ ↓</text>
<text x="372.8" y="170.93" textLength="312" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">scroll it — nothing has been touched yet</text>
<text x="770.6" y="170.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="187.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="187.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">w</text>
<text x="372.8" y="187.18" textLength="343.2" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">widen to the referential closure and re-plan</text>
<text x="770.6" y="187.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="203.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="203.43" textLength="39" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">enter</text>
<text x="372.8" y="203.43" textLength="62.4" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">apply it</text>
<text x="770.6" y="203.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="219.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="219.68" textLength="23.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">esc</text>
<text x="372.8" y="219.68" textLength="124.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">back to the form</text>
<text x="770.6" y="219.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="235.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="770.6" y="235.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="252.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="252.18" textLength="195" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">What a snapshot row means</text>
<text x="770.6" y="252.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="268.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="268.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">l</text>
<text x="372.8" y="268.43" textLength="156" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">on this machine only</text>
<text x="770.6" y="268.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="284.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="284.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">r</text>
<text x="372.8" y="284.68" textLength="358.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">in a remote only — applying downloads it first</text>
<text x="770.6" y="284.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="300.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="300.93" textLength="23.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">l+r</text>
<text x="372.8" y="300.93" textLength="179.4" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">both: here and uploaded</text>
<text x="770.6" y="300.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="317.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="317.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">✗</text>
<text x="372.8" y="317.18" textLength="304.2" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">it did not finish; it cannot be applied</text>
<text x="770.6" y="317.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="333.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="770.6" y="333.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="349.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="349.68" textLength="210.6" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">What a connection row means</text>
<text x="770.6" y="349.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="365.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="365.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">●</text>
<text x="372.8" y="365.93" textLength="70.2" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">reachable</text>
<text x="770.6" y="365.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="382.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="382.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">○</text>
<text x="372.8" y="382.18" textLength="288.6" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">not reached yet — pgctl has not tried</text>
<text x="770.6" y="382.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="398.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="398.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">⠋</text>
<text x="372.8" y="398.43" textLength="132.6" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">being reached now</text>
<text x="770.6" y="398.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="414.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="414.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">✗</text>
<text x="372.8" y="414.68" textLength="280.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">unreachable — Overview has the error</text>
<text x="770.6" y="414.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="430.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="430.93" textLength="70.2" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">protected</text>
<text x="372.8" y="430.93" textLength="265.2" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">never an apply target, no override</text>
<text x="770.6" y="430.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="447.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="447.18" textLength="54.6" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">guarded</text>
<text x="372.8" y="447.18" textLength="288.6" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">an apply needs the name typed in full</text>
<text x="770.6" y="447.18" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="463.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="770.6" y="463.43" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="479.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="479.68" textLength="156" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">What a set row means</text>
<text x="770.6" y="479.68" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="495.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="495.93" textLength="62.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">4 closed</text>
<text x="372.8" y="495.93" textLength="280.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">closed: it can be applied on its own</text>
<text x="770.6" y="495.93" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="512.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="512.17" textLength="23.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">4+2</text>
<text x="372.8" y="512.17" textLength="288.6" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">4 named, 2 dragged in by foreign keys</text>
<text x="770.6" y="512.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="528.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="528.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">?</text>
<text x="372.8" y="528.42" textLength="374.4" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">not resolved yet — select it to read the catalog</text>
<text x="770.6" y="528.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="544.67" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="770.6" y="544.67" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="560.92" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="560.92" textLength="156" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">While something runs</text>
<text x="770.6" y="560.92" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="577.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="577.17" textLength="23.4" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">tab</text>
<text x="372.8" y="577.17" textLength="280.8" lengthAdjust="spacing" fill="#7f7f7f" xml:space="preserve">the steps, then the log it came from</text>
<text x="770.6" y="577.17" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="593.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="287" y="593.42" textLength="62.4" lengthAdjust="spacing" fill="#7f7f7f" font-weight="600" xml:space="preserve">↓ 2 more</text>
<text x="770.6" y="593.42" textLength="7.8" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">│</text>
<text x="279.2" y="609.67" textLength="499.2" lengthAdjust="spacing" fill="#ff00ff" xml:space="preserve">╰──────────────────────────────────────────────────────────────╯</text>
</svg>
