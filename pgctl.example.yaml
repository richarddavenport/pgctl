# pgctl configuration. Commit this next to the schema it describes.
#
# Every key is optional. With no config at all, pgctl connects wherever `psql`
# with no arguments would, discovers the databases there, and can snapshot them.

# A connection is a libpq DSN and a couple of safety flags. That is the whole
# of it: PostgreSQL already has a complete way to describe how to reach a
# server, and pgctl uses it rather than inventing a second one.
#
# A DSN may be:
#   a service name   service=prd          → resolved from ~/.config/pgctl/pg_service.conf
#   a URI            postgres://host/db
#   keyword pairs    host=… port=… user=…
#
# No password appears here, ever. libpq finds it in ~/.pgpass, or in PGPASSWORD,
# exactly as it does for psql and pg_dump — which is what pgctl hands the same
# DSN to, so both halves of an operation connect by identical rules.
connections:
  latest: "service=latest"

  qat:
    dsn: "service=qat"
    # An apply here needs the connection's name typed in full.
    guarded: true

  prd:
    dsn: "service=prd"
    # Never an apply target. There is no flag that turns this off.
    protected: true
    # More vCPUs than a laptop, so more of them are worth using.
    jobs: 8

  local: "postgres://localhost/postgres"

# ~/.config/pgctl/pg_service.conf for the above would look like:
#
#   [prd]
#   host=postgres.example.com
#   port=5432
#   user=youruser
#   dbname=product-development
#   sslmode=require
#
# and ~/.pgpass (chmod 600):
#
#   postgres.example.com:5432:*:youruser:the-password

databases:
  # Databases are discovered from each server, not declared here: a server
  # knows what it has, and a list in a config file can only disagree with it.
  # This trims the ones nobody wants to think about. Patterns may end in `*`.
  exclude: [postgres]

  # excludeSchemas is deliberately empty, and that is not an oversight. Both
  # obvious candidates here — audit, and Hasura's hdb_catalog — own functions
  # that triggers on retained tables call, so excluding either produces an
  # archive whose every CREATE TRIGGER fails at restore, after the data has
  # loaded. Their bulk is removed by rule instead. `pgctl snapshot` checks for
  # this and warns if an exclusion reintroduces it.

defaults:
  jobs: 4
  # zstd:3 rather than the gzip-6 default: faster and smaller both. Requires
  # PostgreSQL 16 or newer, which pgctl requires anyway.
  compression: zstd:3
  # Short, because what this catches is an application still holding a table
  # pgctl is about to truncate — not slow work.
  lockTimeout: 30s

storage:
  kind: azureblob
  container: pg-snapshots
  dir: .pgctl/snapshots
  # Read from the environment, for the same reason database passwords come from
  # ~/.pgpass: a credential belongs where the tools that need it already look.
  accountEnv: AZURE_STORAGE_ACCOUNT
  keyEnv: AZURE_STORAGE_KEY
  retention:
    daily: 7
    weekly: 4
    monthly: 3

sets:
  - name: contracts
    database: product-development
    description: contracts and everything hanging off them
    include: ["operations.*"]

  - name: claims
    database: product-development
    description: claims and claim detail
    include: ["claims.*"]

  - name: reference
    database: product-development
    description: class guides and rating reference data
    include: ["classes.*", "compliance.*"]

rules:
  # 20 GB across ~146,000 rows: a jsonb payload per quote, and two thirds of the
  # database by volume. pg_dump cannot take part of a table, so this one is
  # produced by binary COPY alongside the archive.
  - table: quotes.quote
    where: "created_at > now() - interval '30 days'"
    why: "20 GB of jsonb payloads; recent quotes are enough to work with"

  - table: audit.logged_actions
    data: none
    why: "audit history of another environment is not useful in this one"

  # Hasura rebuilds its own delivery history. The underscore in `*_log*`
  # matters: a bare `*log*` also matches hdb_source_catalog_version — "cata-log"
  # — and blanking that leaves Hasura unable to find its metadata.
  - table: hdb_catalog.*_log*
    data: none
    why: "Hasura event delivery history"
  - table: hdb_catalog.*event*
    data: none
    why: "as above"

# Quiescing a target is project-specific, so it is a hook rather than a built-in
# step. Terminating the database's own connections is built in — that is about
# the database, not about what is connected to it.
#
# $PGCTL_CONNECTION, $PGCTL_DATABASE and $PGCTL_SNAPSHOT are in the environment.
hooks:
  preApply:
    - name: scale the applications down
      run: |
        swarmctl set api_api --replicas 0 --env "$PGCTL_CONNECTION"
        swarmctl set hasura_graphql-engine --replicas 0 --env "$PGCTL_CONNECTION"
      timeout: 5m

  postApply:
    - name: scale the applications up
      run: |
        swarmctl set api_api --replicas 2 --env "$PGCTL_CONNECTION"
        swarmctl set hasura_graphql-engine --replicas 2 --env "$PGCTL_CONNECTION"
      timeout: 5m

  onFailure:
    - name: bring the applications back up
      run: |
        swarmctl set api_api --replicas 2 --env "$PGCTL_CONNECTION"
        swarmctl set hasura_graphql-engine --replicas 2 --env "$PGCTL_CONNECTION"
      timeout: 5m
