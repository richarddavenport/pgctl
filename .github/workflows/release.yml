name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# One checkout, for the reason ci.yml gives: tuikit is a tagged module now, so
# there is no sibling directory to make room for.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history, because the version is `git describe` and a
          # shallow clone cannot see the tag it was triggered by.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The notes, before anything is built. A tag with no CHANGELOG section
      # stops the release here rather than publishing generated commit titles —
      # and it is the same script scripts/release.sh runs, so a local release
      # and this one cannot describe the same tag differently.
      - name: notes
        run: |
          scripts/changelog.sh "${GITHUB_REF_NAME}" > /tmp/notes.md
          cat /tmp/notes.md
      - name: build
        run: |
          mkdir -p dist
          commit=$(git rev-parse --short=9 HEAD)
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*} arch=${target#*/}
            # -trimpath, and scripts/release.sh passes it too: the two paths
            # have to produce the same bytes for a tag, or the checksums of a
            # CI release and a local one differ for no reason anybody could
            # explain from the outside.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=$commit" \
              -o "dist/pgctl-$os-$arch" ./cmd/pgctl
          done
          cd dist && shasum -a 256 * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The CHANGELOG section, not generated_release_notes: a list of
          # commit titles describes what was typed, and a release note has to
          # describe what changed for somebody deciding whether to install it.
          body_path: /tmp/notes.md
