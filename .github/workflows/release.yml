name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Two checkouts, for the reason ci.yml gives.
defaults:
  run:
    working-directory: pgctl

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pgctl
          # The full history, because the version is `git describe` and a
          # shallow clone cannot see the tag it was triggered by.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: richarddavenport/tuikit
          path: tuikit
          token: ${{ secrets.TUIKIT_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: pgctl/go.mod
      - name: build
        run: |
          mkdir -p dist
          commit=$(git rev-parse --short=9 HEAD)
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=$commit" \
              -o "dist/pgctl-$os-$arch" ./cmd/pgctl
          done
          cd dist && shasum -a 256 * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: pgctl/dist/*
          generate_release_notes: true
